<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>TradingView Symbol Converter</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
      body {
        font-family: Arial;
        max-width: 1200px;
        margin: auto;
        padding: 30px;
        background: #f5f5f5;
      }

      h2 {
        margin-bottom: 20px;
      }

      .box {
        background: white;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 25px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
      }

      textarea {
        width: 100%;
        height: 140px;
        font-family: Consolas;
        font-size: 13px;
        margin-top: 10px;
      }

      button {
        margin-top: 10px;
        padding: 10px 25px;
        cursor: pointer;
        border: none;
        background: #1976d2;
        color: white;
        border-radius: 5px;
      }

      .copied {
        background: #d8ffd8 !important;
      }
    </style>
  </head>
  <body>
    <h2>TradingView Watchlist Generator</h2>

    <div class="box">
      <h3>Excel File</h3>
      <input type="file" id="excelFile" accept=".xlsx,.xls" />
    </div>

    <div class="box">
      <h3>CSV File (screener.in export)</h3>
      <input type="file" id="csvFile" accept=".csv" />
    </div>

    <div class="box">
      <h3>CSV File (MarketSmith export)</h3>
      <input type="file" id="marketsmithCsvFile" accept=".csv" />
    </div>

    <div id="output"></div>

    <script>
      document
        .getElementById("excelFile")
        .addEventListener("change", readExcel);

      document
        .getElementById("csvFile")
        .addEventListener("change", (e) => readCsvByColumn(e, "nse code"));

      document
        .getElementById("marketsmithCsvFile")
        .addEventListener("change", (e) => readCsvByColumn(e, "symbol"));

      function readCsvByColumn(e, columnName) {
        const file = e.target.files[0];

        const reader = new FileReader();

        reader.onload = function (evt) {
          const rows = parseCsv(evt.target.result);

          if (rows.length === 0) return;

          const header = rows[0].map((h) => String(h).trim());

          const colIndex = header.findIndex(
            (h) => h.toLowerCase() === columnName,
          );

          if (colIndex === -1) {
            alert('Column "' + columnName + '" not found in CSV file.');
            return;
          }

          let symbols = [];

          for (let i = 1; i < rows.length; i++) {
            const val = rows[i][colIndex];

            if (val != undefined && String(val).trim() !== "") {
              symbols.push(String(val).trim());
            }
          }

          render(symbols);
        };

        reader.readAsText(file);
      }

      function parseCsv(text) {
        const rows = [];

        let row = [];

        let field = "";

        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
          const c = text[i];

          if (inQuotes) {
            if (c === '"') {
              if (text[i + 1] === '"') {
                field += '"';
                i++;
              } else {
                inQuotes = false;
              }
            } else {
              field += c;
            }
          } else {
            if (c === '"') {
              inQuotes = true;
            } else if (c === ",") {
              row.push(field);
              field = "";
            } else if (c === "\n" || c === "\r") {
              if (c === "\r" && text[i + 1] === "\n") i++;

              row.push(field);
              field = "";

              if (row.length > 1 || row[0] !== "") rows.push(row);

              row = [];
            } else {
              field += c;
            }
          }
        }

        if (field !== "" || row.length > 0) {
          row.push(field);
          rows.push(row);
        }

        return rows;
      }

      function readExcel(e) {
        const file = e.target.files[0];

        const reader = new FileReader();

        reader.onload = function (evt) {
          const data = new Uint8Array(evt.target.result);

          const wb = XLSX.read(data, { type: "array" });

          const ws = wb.Sheets[wb.SheetNames[0]];

          const json = XLSX.utils.sheet_to_json(ws, { header: 1 });

          let symbols = [];

          json.forEach((r) => {
            if (r[2] != undefined && r[2] != "" && r[2] !== "Symbol") {
              symbols.push(String(r[2]).trim());
            }
          });

          render(symbols);
        };

        reader.readAsArrayBuffer(file);
      }

      function render(symbols) {
        const output = document.getElementById("output");

        output.innerHTML = "";

        addBox("Original List", symbols.join("\n"));

        let prefixed = symbols.map((s) => "NSE:" + s);

        addBox("Comma Separated", prefixed.join(","));

        let chunk = 30;

        let index = 1;

        for (let i = 0; i < prefixed.length; i += chunk) {
          addBox(
            "Chunk " + index,

            prefixed.slice(i, i + chunk).join(","),
          );

          index++;
        }
      }

      function addBox(title, text) {
        const div = document.createElement("div");

        div.className = "box";

        const h = document.createElement("h3");

        h.innerText = title;

        const ta = document.createElement("textarea");

        ta.value = text;

        const btn = document.createElement("button");

        btn.innerText = "Copy";

        btn.onclick = function () {
          navigator.clipboard.writeText(ta.value);

          document
            .querySelectorAll(".box")
            .forEach((b) => b.classList.remove("copied"));

          document
            .querySelectorAll("button")
            .forEach((b) => (b.innerText = "Copy"));

          div.classList.add("copied");

          btn.innerText = "✓ Copied";
        };

        div.appendChild(h);

        div.appendChild(ta);

        div.appendChild(btn);

        output.appendChild(div);
      }
    </script>
  </body>
</html>
